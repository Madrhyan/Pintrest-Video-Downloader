name: 05 - 🗑️ پاکسازی ویدیوهای پینترست

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: '⚠️ با زدن این دکمه تمام ویدیوهای دانلود شده پینترست حذف میشود'
        required: true
        default: false
        type: boolean

jobs:
  delete-pinterest-videos:
    name: "🗑️ حذف ویدیوهای پینترست"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_delete == 'true' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Delete and Recreate Pinterest Folder
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          echo "========================================"
          echo "🗑️ در حال حذف پوشه pinterest_videos..."
          echo "========================================"

          if [ -d "pinterest_videos" ]; then
            rm -rf pinterest_videos
            echo "✅ پوشه pinterest_videos حذف شد"
          else
            echo "ℹ️ پوشه pinterest_videos وجود نداشت"
          fi

          mkdir -p pinterest_videos

          echo "# Pinterest Videos" > pinterest_videos/README.md
          echo "پوشه ویدیوهای دانلود شده پینترست" >> pinterest_videos/README.md
          echo "در حال حاضر هیچ فایلی اینجا نیست." >> pinterest_videos/README.md

          echo "✅ پوشه pinterest_videos با README جدید بازسازی شد"

          git config set advice.addIgnoredFile false || true
          git add pinterest_videos/ 2>/dev/null || git add -f pinterest_videos/

          if ! git diff --cached --quiet; then
            git commit -m "[SYSTEM] پاکسازی پوشه ویدیوهای پینترست [skip ci]"

            PUSH_RETRY=0
            while [ $PUSH_RETRY -lt 5 ]; do
              PUSH_RETRY=$((PUSH_RETRY + 1))
              if timeout 60 git push origin HEAD:"$BRANCH"; then
                echo ""
                echo "========================================"
                echo "✅ پوشه با موفقیت پاکسازی و سینک شد!"
                echo "========================================"
                break
              else
                echo "Push failed, retry $PUSH_RETRY/5..."
                sleep 5
                git fetch origin "$BRANCH"
                git reset --hard origin/"$BRANCH"
                rm -rf pinterest_videos
                mkdir -p pinterest_videos
                echo "# Pinterest Videos" > pinterest_videos/README.md
                git add pinterest_videos/ 2>/dev/null || git add -f pinterest_videos/
                git diff --cached --quiet || git commit -m "[SYSTEM] پاکسازی پوشه ویدیوهای پینترست [skip ci]"
              fi
            done
          else
            echo "ℹ️ پوشه از قبل تمیز بود و تغییری وجود ندارد"
          fi

  not-confirmed:
    name: "❌ لغو شد"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_delete != 'true' }}
    steps:
      - name: Show cancellation message
        run: |
          echo ""
          echo "========================================"
          echo "❌ عملیات پاکسازی لغو شد"
          echo "========================================"
          echo ""
          echo "⚠️ برای حذف ویدیوها باید تیک تأیید را بزنید"
          echo ""
          echo "========================================"
